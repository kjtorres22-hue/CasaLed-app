<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Casa LED · Inventario y Ventas</title>
<meta name="theme-color" content="#07090D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Casa LED">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07090D;
    --panel:#10141B;
    --panel-2:#171D27;
    --border:#242C3A;
    --text:#F2F5F9;
    --muted:#8A96A8;
    --amber:#2B8CFF;
    --amber-dim:#15335E;
    --silver:#C7D1DC;
    --green:#34D399;
    --red:#F87171;
    --blue:#2B8CFF;
    --font-display:'Space Grotesk', 'Segoe UI', sans-serif;
    --font-body:'Inter', 'Segoe UI', sans-serif;
    --radius:14px;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) { }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F2F5FA;
      --panel:#FFFFFF;
      --panel-2:#E7EDF5;
      --border:#D3DCE8;
      --text:#0C1420;
      --muted:#5C6B80;
      --amber:#1864D1;
      --amber-dim:#D7E6FC;
      --silver:#4B5768;
      --green:#0D9668;
      --red:#D64545;
      --blue:#1864D1;
    }
  }
  :root[data-theme="light"]{
    --bg:#F2F5FA; --panel:#FFFFFF; --panel-2:#E7EDF5; --border:#D3DCE8;
    --text:#0C1420; --muted:#5C6B80; --amber:#1864D1; --amber-dim:#D7E6FC;
    --silver:#4B5768; --green:#0D9668; --red:#D64545; --blue:#1864D1;
  }
  html,body{height:100%;}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }
  #app{ min-height:100%; display:flex; flex-direction:column; }
  header.top{
    position:sticky; top:0; z-index:10;
    padding: calc(14px + env(safe-area-inset-top,0px)) 18px 12px;
    background:var(--bg);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .bulb{
    width:11px; height:11px; border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 10px 2px var(--amber);
  }
  .brand h1{ font-family:var(--font-display); font-weight:700; font-size:17px; margin:0; letter-spacing:.2px; }
  .brand small{ display:block; color:var(--muted); font-size:11.5px; margin-top:1px; }
  main{ flex:1; padding:14px 14px 96px; max-width:640px; width:100%; margin:0 auto; }
  h2.section-title{ font-family:var(--font-display); font-size:15px; font-weight:600; margin:18px 0 10px; color:var(--text); }
  h2.section-title:first-child{ margin-top:4px; }
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; margin-bottom:10px;
  }
  .row{ display:flex; align-items:center; gap:10px; }
  .between{ justify-content:space-between; }
  .muted{ color:var(--muted); }
  .small{ font-size:12.5px; }
  .mono{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; }
  label{ display:block; font-size:12px; color:var(--muted); margin:0 0 5px 2px; }
  input, select, textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:10px 11px; font-size:16px; font-family:var(--font-body);
    outline:none;
  }
  input:focus, select:focus, textarea:focus{ border-color:var(--amber); }
  .field{ margin-bottom:10px; }
  .field-row{ display:flex; gap:8px; }
  .field-row > .field{ flex:1; }
  button{ font-family:var(--font-body); cursor:pointer; border:none; }
  html{ -webkit-text-size-adjust:100%; touch-action:manipulation; }
  button, a, select, input, label, .chip{ touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  .btn{
    background:var(--panel-2); color:var(--text); border:1px solid var(--border);
    border-radius:10px; padding:10px 14px; font-size:14px; font-weight:600;
  }
  .btn:active{ transform:scale(.98); }
  .btn-primary{ background:var(--amber); color:#04070C; border:1px solid var(--amber); }
  .btn-primary:disabled{ opacity:.4; }
  .btn-danger{ background:transparent; color:var(--red); border:1px solid var(--red); }
  .btn-ghost{ background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn-sm{ padding:6px 10px; font-size:12.5px; border-radius:8px; }
  .btn-block{ width:100%; }
  .chip{
    display:inline-flex; align-items:center; padding:6px 12px; border-radius:999px;
    border:1px solid var(--border); background:var(--panel-2); color:var(--muted);
    font-size:13px; font-weight:600; white-space:nowrap;
  }
  .chip.active{ background:var(--amber-dim); border-color:var(--amber); color:var(--amber); }
  :root[data-theme="light"] .chip.active, .chip.active{ }
  .chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin-bottom:12px; }
  .chips::-webkit-scrollbar{ display:none; }
  .stock-pill{
    font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px;
    font-variant-numeric:tabular-nums;
  }
  .stock-ok{ background:rgba(52,211,153,.15); color:var(--green); }
  .stock-low{ background:rgba(248,113,113,.15); color:var(--red); }
  .product-row{ display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--border); gap:10px; }
  .product-row:last-child{ border-bottom:none; }
  .product-name{ font-weight:600; font-size:14.5px; }
  .product-sub{ font-size:12px; color:var(--muted); margin-top:2px; }
  .qty-control{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .qty-btn{
    width:44px; height:44px; border-radius:12px; background:var(--panel-2); border:1px solid var(--border);
    color:var(--text); font-size:24px; font-weight:700; line-height:1; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none;
  }
  .qty-btn:active{ background:var(--amber-dim); border-color:var(--amber); }
  .qty-val{ min-width:30px; text-align:center; font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; }
  .cart-bar{
    position:fixed; left:0; right:0; bottom:64px; z-index:15;
    display:flex; justify-content:center; padding:0 14px;
  }
  .cart-inner{
    max-width:612px; width:100%; background:var(--amber); color:#04070C;
    border-radius:14px; padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 8px 24px rgba(0,0,0,.35); font-weight:700; font-size:14px;
  }
  nav.bottom{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    background:var(--panel); border-top:1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom,0px);
    display:flex;
  }
  nav.bottom button{
    flex:1; background:transparent; padding:9px 1px 8px; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--muted); font-size:9.5px; font-weight:600;
  }
  nav.bottom button svg{ width:18px; height:18px; }
  nav.bottom button.active{ color:var(--amber); }
  .empty{ text-align:center; padding:40px 10px; color:var(--muted); }
  .empty .bigdot{ width:8px;height:8px;border-radius:50%;background:var(--amber);display:inline-block;margin-bottom:10px;box-shadow:0 0 10px 3px var(--amber);}
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:18px 18px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px)); width:100%; max-width:640px;
    max-height:85vh; overflow-y:auto;
  }
  .modal h3{ font-family:var(--font-display); margin:0 0 14px; font-size:16px; }
  .modal-close{ position:absolute; top:14px; right:14px; }
  .divider{ height:1px; background:var(--border); margin:12px 0; }
  .invoice-preview{
    background:var(--panel-2); border:1px dashed var(--border); border-radius:10px; padding:12px;
    font-size:12.5px; white-space:pre-wrap; font-family:'Space Grotesk',monospace; line-height:1.5;
    margin-top:10px; color:var(--text);
  }
  .list-item{ padding:11px 0; border-bottom:1px solid var(--border); }
  .zona-pegar{ min-height:110px; border:2px dashed var(--amber); border-radius:14px; padding:16px; text-align:center;
    color:var(--muted); font-size:14px; background:var(--panel-2); outline:none; -webkit-user-select:text; user-select:text; }
  .zona-pegar:empty:before{ content:attr(data-ph); }
  .linea-compra{ padding:10px; border:1px solid var(--border); border-radius:12px; margin-bottom:8px; }
  .linea-compra.revisar{ border-color:var(--amber); }
  .linea-compra.ignorada{ opacity:.55; }
  .linea-compra select, .linea-compra input{ padding:8px 10px; font-size:14px; }
  .list-item:last-child{ border-bottom:none; }
  .badge{ font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; }
  .badge-entrada{ background:rgba(52,211,153,.15); color:var(--green); }
  .badge-salida{ background:rgba(96,165,250,.15); color:var(--blue); }
  .badge-garantia{ background:rgba(248,113,113,.15); color:var(--red); }
  .toast{
    position:fixed; bottom:150px; left:50%; transform:translateX(-50%); z-index:60; max-width:90vw; text-align:center;
    background:var(--text); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:13.5px; font-weight:600;
    box-shadow:0 6px 18px rgba(0,0,0,.3);
  }
  .filterbar{ display:flex; gap:8px; margin-bottom:10px; overflow-x:auto; }
  select.inline{ width:auto; padding:7px 10px; font-size:12.5px; }
  .kpi-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .kpi{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px; }
  .kpi .num{ font-family:var(--font-display); font-size:22px; font-weight:700; }
  .kpi .lbl{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .searchbox{ margin-bottom:12px; }
  .bar-row{ margin-bottom:12px; }
  .bar-row:last-child{ margin-bottom:0; }
  .bar-track{ height:8px; background:var(--panel-2); border-radius:999px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--blue); border-radius:999px; }
  .link-btn{ background:none; border:none; color:var(--amber); font-weight:600; font-size:13px; padding:4px; }
  .offline-pill{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; background:rgba(248,113,113,.15); color:var(--red); white-space:nowrap; }
  .auth-wrap{ max-width:380px; margin:30px auto 0; }
  .auth-logo{ display:block; width:132px; height:132px; border-radius:50%; margin:0 auto 18px; box-shadow:0 0 40px rgba(43,140,255,.35); }
  .auth-wrap h2{ font-family:var(--font-display); text-align:center; margin:0 0 4px; font-size:20px; }
  .auth-wrap p.lead{ text-align:center; color:var(--muted); font-size:13.5px; margin:0 0 18px; }
  .btn-wa{ display:block; text-align:center; text-decoration:none; background:#25D366; color:#04140A; border:1px solid #25D366; border-radius:10px; padding:13px 14px; font-weight:700; font-size:15px; }
  body.auth-mode nav.bottom, body.auth-mode #header-actions{ display:none; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <span class="bulb"></span>
      <div>
        <h1><span style="color:var(--blue);">CASA</span><span style="color:var(--silver);">LED</span></h1>
        <small id="header-sub">Inventario y ventas</small>
      </div>
    </div>
    <div class="row" style="gap:6px;" id="header-actions">
      <span class="offline-pill" id="offline-pill" style="display:none;">Sin señal</span>
      <button class="btn btn-sm btn-ghost" data-action="actualizar-app" aria-label="Actualizar" title="Actualizar" style="font-size:17px;padding:5px 10px;">↻</button>
      <button class="btn btn-sm btn-ghost" id="btn-admin" data-action="abrir-cuenta">Cuenta</button>
      <button class="btn btn-sm btn-ghost" data-action="open-ajustes-empresa">Ajustes</button>
    </div>
  </header>
  <main id="main"></main>
  <div id="cart-bar-slot"></div>
  <nav class="bottom">
    <button data-tab="vender">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg>
      Vender
    </button>
    <button data-tab="inventario">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      Inventario
    </button>
    <button data-tab="garantias">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5z"/></svg>
      Garantías
    </button>
    <button data-tab="clientes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      Clientes
    </button>
    <button data-tab="historial">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 3"/></svg>
      Historial
    </button>
    <button data-tab="reportes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg>
      Reportes
    </button>
  </nav>
</div>
<script type="module">
import { firebaseConfig, OWNER_EMAIL, USE_EMULATORS } from './firebase-config.js';
import { generarFacturaPDF, generarSoporteDIAN, generarPedidoPDF, TITULO_DOC } from './factura-pdf.js';
import { leerPDF, textoAPaginas, parsearFactura, leerRUT } from './compras-parser.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  signOut, sendPasswordResetEmail, sendEmailVerification, updateProfile, connectAuthEmulator,
  setPersistence, browserLocalPersistence
} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager, connectFirestoreEmulator,
  collection, doc, query, orderBy, limit, onSnapshot, getDoc, getDocs, setDoc, updateDoc, deleteDoc,
  writeBatch, runTransaction, increment, FieldPath
} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const fbApp = initializeApp(firebaseConfig);
const fbAuth = getAuth(fbApp);
const fs = initializeFirestore(fbApp, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});
if(USE_EMULATORS){
  connectAuthEmulator(fbAuth, 'http://127.0.0.1:9099', { disableWarnings:true });
  connectFirestoreEmulator(fs, '127.0.0.1', 8080);
}
setPersistence(fbAuth, browserLocalPersistence).catch(function(){});

(function(){
  "use strict";

  var state = {
    ready:false, dbOk:null,
    productos:[], clientes:[], rutas:[], movimientos:[], ventas:[], gastos:[], config:null,
    activeTab:'vender',
    cart:{}, // productoId -> cantidad
    selectedRutaId:'__todas__',
    selectedClienteId:null,
    modal:null,
    toastMsg:null,
    histFiltro:'todos',
    isAdmin:false,
    reordenando:false,
    reportePeriodo:'mes',
    analisisIA:null,
    analisisLoading:false,
    checkoutPago:'contado',
    checkoutAbono:0,
    checkoutComentarios:'',
    gastoFiltroRuta:'__todas__',
    online: navigator.onLine,
    // auth: loading | signedOut | verify | pending | blocked | ready
    auth: { status:'loading', user:null, perfil:null, pantalla:'login', error:'' },
    usuarios: [],
    jornadas: [],
    compras: [],
    contaMes: null,
    importando: false,
    editandoVenta: null
  };
  var unsub = [];
  var ADMIN_ACTIONS = ['abrir-nuevo-producto','abrir-editar-producto','abrir-entrada','eliminar-producto','guardar-empresa','trigger-bulk-fotos','mover-arriba','mover-abajo','toggle-reordenar','cambiar-rol','importar-datos','crear-ruta','eliminar-ruta','guardar-numeracion','editar-factura','eliminar-factura','editar-gasto','cerrar-ruta-de','abrir-incluir-facturas','incluir-facturas','exportar-ventas','exportar-compras','nueva-compra','editar-compra','adjuntar-compra','ver-compra','guardar-compra','eliminar-compra','agregar-factura-compra','pegar-compra-portapapeles','elegir-archivo-compra','aplicar-compra','compra-solo-archivar','leer-rut','marcar-pagado','abrir-cobros','abrir-pedido','cerrar-pedido','limpiar-pedido','generar-pedido'];
  var sampleApi = null; // el análisis con IA solo existía dentro de Claude

  function mensajeError(err){
    var code = (err && err.code) || '';
    if(code==='permission-denied') return 'No tienes permiso para hacer eso.';
    if(code==='unavailable') return 'Sin conexión: se guardará cuando vuelva la señal.';
    if(code==='resource-exhausted') return 'Se superó el límite gratuito de hoy. Intenta más tarde.';
    return 'No se pudo guardar' + (code?(' ('+code+')'):'') + '. Intenta de nuevo.';
  }
  // Recarga la app trayendo la última versión (lo pendiente por subir queda guardado en el teléfono).
  async function actualizarApp(){
    state.modal = null;
    toast('Actualizando…');
    try{
      if('serviceWorker' in navigator){
        var reg = await navigator.serviceWorker.getRegistration();
        if(reg) await Promise.race([reg.update(), new Promise(function(r){ setTimeout(r, 3000); })]);
      }
    }catch(e){}
    setTimeout(function(){ location.reload(); }, 300);
  }
  function reportarError(err){ console.error(err); toast(mensajeError(err)); }
  window.addEventListener('unhandledrejection', function(ev){ reportarError(ev.reason||{}); });
  window.addEventListener('online', function(){ state.online = true; render(); });
  window.addEventListener('offline', function(){ state.online = false; render(); });

  // ---------- CAPA DE DATOS (Firestore) ----------
  // Mantiene la misma forma de llamadas que usaba la app (db.collection(...).add, db.doc(...).update, onSnapshot...).
  // Las escrituras NO esperan al servidor: quedan en el teléfono y se suben solas cuando hay señal.
  function wrapQuerySnap(qs){
    return { empty: qs.empty, docs: qs.docs.map(function(d){ return { id:d.id, data:function(){ return d.data(); } }; }) };
  }
  function wrapDocSnap(ds){
    return { id: ds.id, exists: ds.exists(), data: function(){ return ds.data(); } };
  }
  function enSegundoPlano(promesa){ promesa.catch(reportarError); return Promise.resolve(); }
  function makeQuery(colName, constraints){
    var q = constraints.length ? query(collection(fs, colName), ...constraints) : collection(fs, colName);
    return {
      orderBy: function(f, dir){ return makeQuery(colName, constraints.concat([orderBy(f, dir||'asc')])); },
      limit: function(n){ return makeQuery(colName, constraints.concat([limit(n)])); },
      onSnapshot: function(cb, errCb){
        var u = onSnapshot(q, function(qs){ cb(wrapQuerySnap(qs)); }, function(e){ console.error(e); if(errCb) errCb(e); });
        unsub.push(u); return u;
      },
      get: function(){ return getDocs(q).then(wrapQuerySnap); }
    };
  }
  function makeDoc(path){
    var ref = doc(fs, path);
    return {
      id: ref.id,
      get: function(){ return getDoc(ref).then(wrapDocSnap); },
      set: function(data, opts){ return enSegundoPlano(setDoc(ref, data, opts||{})); },
      update: function(data){ return enSegundoPlano(updateDoc(ref, data)); },
      delete: function(){ return enSegundoPlano(deleteDoc(ref)); },
      onSnapshot: function(cb, errCb){
        var u = onSnapshot(ref, function(ds){ cb(wrapDocSnap(ds)); }, function(e){ console.error(e); if(errCb) errCb(e); });
        unsub.push(u); return u;
      }
    };
  }
  var db = {
    collection: function(name){
      var q = makeQuery(name, []);
      q.add = function(data){
        var ref = doc(collection(fs, name));
        enSegundoPlano(setDoc(ref, data));
        return Promise.resolve({ id: ref.id });
      };
      q.doc = function(id){ return makeDoc(name+'/'+id); };
      return q;
    },
    doc: function(path){ return makeDoc(path); }
  };
  function nuevoId(col){ return doc(collection(fs, col)).id; }

  // Fotos: se reducen en el teléfono y se guardan dentro del producto (no necesita Storage ni plan pago).
  function reducirImagen(file, maxLado, calidad){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var factor = Math.min(1, maxLado / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width*factor); c.height = Math.round(img.height*factor);
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,c.width,c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', calidad));
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('imagen')); };
      img.src = url;
    });
  }

  function iniciarRuta(rutaId){

  // Balance de una jornada: se calcula con las ventas y gastos actuales (incluye ediciones y facturas eliminadas).
  function resumenJornada(j){
    var ventas = state.ventas.filter(function(v){ return v.jornadaId===j.id; }).sort(function(a,b){ return (a.numero||0)-(b.numero||0); });
    var gastos = state.gastos.filter(function(g){ return g.jornadaId===j.id; });
    var r = { facturas:ventas.length, totalVendido:0, contado:0, credito:0, abonos:0, saldoPendiente:0, efectivo:0, transferencia:0, sinMedio:0,
      unidades:0, totalGastos:0, productos:[], deudores:[], gastos:[], numeros:[] };
    var porProd = {};
    ventas.forEach(function(v){
      var t = Number(v.total)||0;
      r.totalVendido += t; r.numeros.push(v.numero);
      if(v.tipoPago==='credito'){
        r.credito += t; r.abonos += Number(v.abono)||0; r.saldoPendiente += Number(v.saldo)||0;
        if((Number(v.saldo)||0) > 0) r.deudores.push({cliente:v.clienteNombre||'', numero:v.numero, saldo:Number(v.saldo)||0, total:t});
      } else { r.contado += t; }
      var recibidoV = v.tipoPago==='credito' ? (Number(v.abono)||0) : t;
      if(v.medioPago==='transferencia') r.transferencia += recibidoV;
      else if(v.medioPago==='efectivo') r.efectivo += recibidoV;
      else r.sinMedio += recibidoV;
      (v.items||[]).forEach(function(it){
        var k = it.nombre;
        if(!porProd[k]) porProd[k] = {nombre:it.nombre, cantidad:0, total:0};
        porProd[k].cantidad += Number(it.cantidad)||0; porProd[k].total += Number(it.subtotal)||0;
        r.unidades += Number(it.cantidad)||0;
      });
    });
    r.productos = Object.keys(porProd).map(function(k){ return porProd[k]; }).sort(function(a,b){ return b.cantidad-a.cantidad; });
    gastos.forEach(function(g){ r.totalGastos += Number(g.monto)||0; r.gastos.push({concepto:g.concepto, monto:Number(g.monto)||0, nota:g.nota||''}); });
    r.recibido = r.contado + r.abonos;
    // los gastos de ruta se pagan en efectivo; lo que llegó por transferencia ya está en la cuenta
    r.efectivoNeto = r.efectivo + r.sinMedio - r.totalGastos;
    return r;
  }

      if(m.config){ var rc = m.config(state.config||{}); if(Object.keys(rc).length){ b.update(doc(fs, 'config/general'), rc); n++; } }
      (m.eliminar||[]).forEach(function(pid){
        if(productoById(pid)){ b.delete(doc(fs, 'productos/'+pid)); n++; }
      });
      marcas['migraciones.'+m.id] = todayISO();

  function sumaStockPorColor(mapa){
    return Object.keys(mapa||{}).reduce(function(s,k){ return s+(Number(mapa[k])||0); },0);

  // Cambia el stock de forma atómica (sirve aunque dos personas vendan al tiempo y funciona sin señal).
  function cambiosDeStock(p, delta, color){
    var args = [new FieldPath('stock'), increment(delta)];
    if(color && p && p.colores && p.colores.length){
      args.push(new FieldPath('stockPorColor', color), increment(delta));
    }
    return args;
  }
  function actualizarStock(batch, p, delta, color, extra){
    var args = cambiosDeStock(p, delta, color);
    if(extra){ Object.keys(extra).forEach(function(k){ args.push(new FieldPath(k), extra[k]); }); }
    batch.update(doc(fs, 'productos/'+p.id), ...args);

  // ---------- COSTO POR LOTES (primero en entrar, primero en salir) ----------
  // p.lotes = [{cant, costo, fecha, ref}] del más viejo al más nuevo. Lo que hay en stock son las últimas
  // unidades que entraron; al vender, salen primero las más viejas de esas. Sin lotes se usa costoCompra.
  function porcionesEnStock(p, stock){
    var lotes = (p && p.lotes) || [];
    var resta = Math.max(0, Number(stock)||0), porciones = [];
    for(var i = lotes.length-1; i >= 0 && resta > 0; i--){
      var c = Math.min(Number(lotes[i].cant)||0, resta);
      if(c > 0){ porciones.unshift({cant:c, costo:Number(lotes[i].costo)||0}); resta -= c; }
    }
    if(resta > 0) porciones.unshift({cant:resta, costo:Number(p.costoBase!=null ? p.costoBase : (lotes.length ? lotes[0].costo : p.costoCompra))||0});
    return porciones;
  }
  // Costo total de las próximas q unidades que salen, con el stock que hay antes de la venta.
  function costoSalida(p, q, stockAntes){
    q = Number(q)||0; if(!p || q <= 0) return 0;
    if(!p.lotes || !p.lotes.length) return q * (Number(p.costoCompra)||0);
    var porciones = porcionesEnStock(p, stockAntes), total = 0, falta = q;
    for(var i = 0; i < porciones.length && falta > 0; i++){
      var t = Math.min(porciones[i].cant, falta); total += t * porciones[i].costo; falta -= t;
    }
    if(falta > 0){ var ult = p.lotes[p.lotes.length-1]; total += falta * (Number(ult.costo)||Number(p.costoCompra)||0); }
    return total;
  }
  // Pone a cada renglón el costo de las unidades que salen (costo por unidad y total).
  function asignarCostos(items, previos){
    var usados = {};
    items.forEach(function(it){
      var p = productoById(it.productoId); var q = Number(it.cantidad)||0;
      var prev = previos ? previos.find(function(o){ return claveItem(o)===claveItem(it); }) : null;
      var total;
      if(prev && prev.costoUnit != null){
        var qPrev = Number(prev.cantidad)||0;
        var extra = Math.max(0, q - qPrev);
        total = Math.min(q, qPrev) * Number(prev.costoUnit) + (extra && p ? costoSalida(p, extra, (Number(p.stock)||0) - (usados[it.productoId]||0)) : 0);
        usados[it.productoId] = (usados[it.productoId]||0) + extra;
      } else if(p){
        total = costoSalida(p, q, (Number(p.stock)||0) - (usados[it.productoId]||0));
        usados[it.productoId] = (usados[it.productoId]||0) + q;
      } else return;
      it.costoTotal = Math.round(total);
      it.costoUnit = q ? Math.round(total / q * 100) / 100 : 0;
    });
    return items;
  }
  // Agrega lotes nuevos a un producto. Si no tenía lotes, lo que ya había en stock queda como un lote al costo anterior.
  function lotesConEntrada(p, nuevos){
    var lotes = (p.lotes || []).slice();
    var stockAntes = Math.max(0, Number(p.stock)||0);
    if(!lotes.length && stockAntes > 0) lotes.push({cant:stockAntes, costo:Number(p.costoCompra)||0, fecha:todayISO(), ref:'Inventario anterior'});
    nuevos.forEach(function(n){
      if(!(Number(n.cant) > 0)) return;
      lotes.push({cant:Number(n.cant), costo:Number(n.costo)||0, fecha:todayISO(), ref:n.ref||''});
    });
    // se borran los lotes viejos que ya se vendieron (se deja uno de margen)
    var stockNuevo = stockAntes + nuevos.reduce(function(s2,n){ return s2 + (Number(n.cant)||0); }, 0);
    var acum = 0, desde = 0;
    for(var i = lotes.length-1; i >= 0; i--){ acum += Number(lotes[i].cant)||0; if(acum >= stockNuevo){ desde = Math.max(0, i-1); break; } }
    var costoBase = p.costoBase != null ? p.costoBase : null;
    if(desde > 0){ costoBase = Number(lotes[desde-1].costo)||0; lotes = lotes.slice(desde); }
    if(lotes.length > 15){ costoBase = Number(lotes[lotes.length-16].costo)||0; lotes = lotes.slice(-15); }
    return {lotes:lotes, costoBase:costoBase};
  }
  function textoLotes(p){
    if(!p.lotes || !p.lotes.length) return '';
    var por = porcionesEnStock(p, p.stock);
    var distintos = por.filter(function(x, i){ return i===0 || x.costo !== por[i-1].costo; });
    if(distintos.length < 2) return '';
    // juntar porciones seguidas con el mismo costo
    var juntas = [];
    por.forEach(function(x){ var u = juntas[juntas.length-1]; if(u && u.costo===x.costo) u.cant += x.cant; else juntas.push({cant:x.cant, costo:x.costo}); });
    return 'Quedan '+juntas.map(function(x){ return fmtNum(x.cant)+' a '+fmtCOP(x.costo); }).join(' · ');
  }
  function costoDeItem(it){
    if(it.costoTotal != null) return Number(it.costoTotal)||0;
    var p = productoById(it.productoId);
    return p ? (Number(p.costoCompra)||0) * (Number(it.cantidad)||0) : 0;
  }

  // Número de factura: con señal se reserva en el servidor (no se repite aunque vendan dos al tiempo);
  // sin señal se usa el siguiente número conocido y el contador se sube al volver la señal.
  async function siguienteNumeroFactura(){
    var ref = doc(fs, 'config/general');
    if(navigator.onLine){
      try{
        var tx = runTransaction(fs, async function(t){
          var snap = await t.get(ref);
          var n = (Number(snap.exists() ? snap.data().contadorFactura : 0)||0) + 1;
          t.set(ref, {contadorFactura:n}, {merge:true});
          return n;
        });
        var tiempo = new Promise(function(_, rej){ setTimeout(function(){ rej({code:'timeout'}); }, 6000); });
        return { numero: await Promise.race([tx, tiempo]), reservado:true };
      }catch(e){
        if(e && e.code==='permission-denied') throw e;
      }
    }
    var n = (Number(state.config && state.config.contadorFactura)||0) + 1;
    return { numero:n, reservado:false };
  }

  async function confirmarVenta(clienteDirecto){
    var items = asignarCostos(buildCartItems());
    if(items.length===0){ toast('Agrega productos al pedido'); return; }
    var cliente = clienteDirecto || clienteById(state.selectedClienteId);
    if(!cliente){ toast('Elige o crea el cliente'); return; }
    if(state.ventaEnCurso) return;
    state.ventaEnCurso = true;
    var total = items.reduce(function(s,it){return s+it.subtotal;},0);
    var cfg = cfgEmpresa();
    var ruta = rutaById(cliente.rutaId);
    var jornadaVenta = miJornada();
    if(!jornadaVenta){ state.ventaEnCurso = false; toast('Primero inicia la ruta'); return; }
    var tipoPago = state.checkoutPago || 'contado';
    var abono = tipoPago==='credito' ? Math.max(0, Math.min(total, Number(state.checkoutAbono)||0)) : total;
    var saldo = Math.max(0, total - abono);
    var medioPago = abono > 0 ? (state.checkoutMedio || 'efectivo') : null;

    try{
      var reserva = await siguienteNumeroFactura();
      var numero = reserva.numero;
      var b = writeBatch(fs);
      var ventaDoc;
      if(!reserva.reservado){
        b.set(doc(fs,'config/general'), {contadorFactura: increment(1)}, {merge:true});
      }
      var ventaRef = doc(collection(fs,'ventas'));
      var fecha = todayISO();
      ventaDoc = {
        numero:numero, clienteId:cliente.id, clienteNombre:cliente.nombre, clienteTelefono:cliente.telefono||'',
        rutaId:(jornadaVenta?jornadaVenta.rutaId:(cliente.rutaId||null)), rutaNombre:(jornadaVenta?jornadaVenta.rutaNombre:(ruta?ruta.nombre:'')),
        jornadaId:jornadaVenta?jornadaVenta.id:null, items:items, total:total,
        tipoPago:tipoPago, abono:abono, saldo:saldo, medioPago:medioPago, fecha:fecha,
        plazoCredito: tipoPago==='credito' ? (state.checkoutPlazo || 8) : null,
        fechaVencimiento: tipoPago==='credito' ? fechaVencimiento(fecha, state.checkoutPlazo || 8) : null,
        comentarios:(state.checkoutComentarios||'').trim(),
        vendedorId:state.auth.user.uid, vendedorNombre:nombreUsuario()
      };
      b.set(ventaRef, ventaDoc);
      // un solo update por producto, sumando todos los colores del pedido
      var porProducto = {};
      items.forEach(function(it){
        if(!porProducto[it.productoId]) porProducto[it.productoId] = {total:0, porColor:{}};
        porProducto[it.productoId].total += it.cantidad;
        if(it.color) porProducto[it.productoId].porColor[it.color] = (porProducto[it.productoId].porColor[it.color]||0) + it.cantidad;
      });
      Object.keys(porProducto).forEach(function(pid){
        var p = productoById(pid);
        if(!p) return;
        var dec = porProducto[pid];
        var args = [new FieldPath('stock'), increment(-dec.total)];
        if(p.colores && p.colores.length){
          Object.keys(dec.porColor).forEach(function(color){
            args.push(new FieldPath('stockPorColor', color), increment(-dec.porColor[color]));
          });
        }
        b.update(doc(fs,'productos/'+pid), ...args);
      });
      items.forEach(function(it){
        b.set(doc(collection(fs,'movimientos')), {
          tipo:'salida', productoId:it.productoId, productoNombre:it.nombre, cantidad:it.cantidad,
          clienteId:cliente.id, clienteNombre:cliente.nombre, ventaId:ventaRef.id, fecha:fecha,
          usuarioId:state.auth.user.uid, usuarioNombre:nombreUsuario()
        });
      });
      enSegundoPlano(b.commit());

      state.cart = {};
      state.selectedClienteId = null;
      state.checkoutPago = 'contado';
      state.checkoutAbono = 0;
      state.checkoutMedio = 'efectivo';
      state.checkoutPlazo = 8;
      state.checkoutComentarios = '';
      abrirFactura(Object.assign({id:ventaRef.id}, ventaDoc), cliente, true);
    }catch(e){
      reportarError(e);
    }finally{
      state.ventaEnCurso = false;
    }
  }

  // Guarda los cambios de una factura: ajusta el stock solo por la diferencia y deja registro en movimientos.
  async function guardarEdicionVenta(clienteDirecto){
    var orig = state.editandoVenta; if(!orig) return;
    var items = asignarCostos(buildCartItems(), orig.items||[]);
    if(!items.length){ toast('La factura debe tener al menos un producto'); return; }
    var cliente = clienteDirecto || clienteById(state.selectedClienteId) ||
      (state.selectedClienteId && state.selectedClienteId===orig.clienteId ? {id:orig.clienteId, nombre:orig.clienteNombre, telefono:orig.clienteTelefono} : null);
    if(!cliente){ toast('Elige el cliente'); return; }
    var total = items.reduce(function(s,it){ return s+it.subtotal; }, 0);
    var tipoPago = state.checkoutPago || 'contado';
    var abono = tipoPago==='credito' ? Math.max(0, Math.min(total, Number(state.checkoutAbono)||0)) : total;
    var saldo = Math.max(0, total - abono);

    var delta = {};
    (orig.items||[]).forEach(function(it){ var k = claveItem(it); delta[k] = (delta[k]||0) - (Number(it.cantidad)||0); });
    items.forEach(function(it){ var k = claveItem(it); delta[k] = (delta[k]||0) + it.cantidad; });

    var b = writeBatch(fs);
    var porProd = {};
    Object.keys(delta).forEach(function(k){
      var d = delta[k]; if(!d) return;
      var parts = k.split('|'), pid = parts[0], color = parts[1] || null;
      if(!porProd[pid]) porProd[pid] = {total:0, porColor:{}};
      porProd[pid].total += d;
      if(color) porProd[pid].porColor[color] = (porProd[pid].porColor[color]||0) + d;
    });
    Object.keys(porProd).forEach(function(pid){
      var p = productoById(pid); if(!p) return;
      var dd = porProd[pid];
      var args = [new FieldPath('stock'), increment(-dd.total)];
      if(p.colores && p.colores.length){
        Object.keys(dd.porColor).forEach(function(c){ if(dd.porColor[c]) args.push(new FieldPath('stockPorColor', c), increment(-dd.porColor[c])); });
      }
      b.update(doc(fs, 'productos/'+pid), ...args);
    });
    var fecha = todayISO();
    Object.keys(delta).forEach(function(k){
      var d = delta[k]; if(!d) return;
      var parts = k.split('|'); var p = productoById(parts[0]);
      b.set(doc(collection(fs, 'movimientos')), {
        tipo: d>0 ? 'salida' : 'entrada', productoId:parts[0],
        productoNombre:(p?p.nombre:'')+(parts[1]?(' - '+parts[1]):''), cantidad:Math.abs(d),
        clienteId:cliente.id, clienteNombre:cliente.nombre, ventaId:orig.id,
        nota:'Edición factura #'+orig.numero, fecha:fecha,
        usuarioId:state.auth.user.uid, usuarioNombre:nombreUsuario()
      });
    });
    var ruta = rutaById(cliente.rutaId);
    var cambios = {
      clienteId:cliente.id, clienteNombre:cliente.nombre, clienteTelefono:cliente.telefono||'',
      rutaId:cliente.rutaId||orig.rutaId||null, rutaNombre:ruta?ruta.nombre:(orig.rutaNombre||''),
      items:items, total:total, tipoPago:tipoPago, abono:abono, saldo:saldo, medioPago: abono > 0 ? (state.checkoutMedio || 'efectivo') : null,
      plazoCredito: tipoPago==='credito' ? (state.checkoutPlazo || 8) : null,
      fechaVencimiento: tipoPago==='credito' ? fechaVencimiento(orig.fecha, state.checkoutPlazo || 8) : null,
      comentarios:(state.checkoutComentarios||'').trim(),
      editadoEn:fecha, editadoPor:nombreUsuario()
    };
    b.update(doc(fs, 'ventas/'+orig.id), cambios);
    enSegundoPlano(b.commit());

    var actualizada = Object.assign({}, orig, cambios);
    state.editandoVenta = null; state.cart = {}; state.selectedClienteId = null;
    state.checkoutPago = 'contado'; state.checkoutAbono = 0; state.checkoutMedio = 'efectivo'; state.checkoutPlazo = 8; state.checkoutComentarios = '';
    abrirFactura(actualizada, cliente, false);
    state.modal.editada = true; render();
    toast('Factura #'+orig.numero+' actualizada');
  }

  // Elimina una factura y devuelve todas sus unidades al inventario (por color cuando aplica).

  // ---------- ARCHIVO CONTABLE ----------
  var TAM_PARTE = 700000; // caracteres base64 por documento (Firestore admite hasta 1 MB)
  function bytesABase64(bytes){
    var bin = ''; var paso = 0x8000;
    for(var i = 0; i < bytes.length; i += paso){ bin += String.fromCharCode.apply(null, bytes.subarray(i, i + paso)); }
    return btoa(bin);
  }
  function base64ABytes(b64){
    var bin = atob(b64); var out = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  async function guardarArchivoCompra(compraId, file){

    var b64, nombre = file.name || ('compra-'+compraId);

      var dataUrl = await reducirImagen(file, 1800, 0.82);
      b64 = dataUrl.split(',')[1]; tipo = 'image/jpeg'; nombre = nombre.replace(/\.[^.]+$/, '') + '.jpg';
    } else {
      b64 = bytesABase64(new Uint8Array(await file.arrayBuffer()));
    }
    var partes = Math.ceil(b64.length / TAM_PARTE);
    if(partes > 12) throw {code:'archivo-grande'};
    var b = writeBatch(fs);
    for(var i = 0; i < partes; i++){
      b.set(doc(fs, 'compras_archivos/'+compraId+'_'+i), { compraId:compraId, parte:i, data:b64.slice(i*TAM_PARTE, (i+1)*TAM_PARTE) });
    }
    b.set(doc(fs, 'compras/'+compraId), { partes:partes, nombreArchivo:nombre, tipoArchivo:tipo, tamano:Math.round(b64.length*0.75) }, {merge:true});
    await b.commit();
  }

  // El código del proveedor para un producto (y color): lo último aprendido de las facturas, si no, lo visto en la 39072.
  function codigoProveedor(pid, color){
    var k = pid + (color ? '|' + color : '');

  var COLORES_COMPRA = [

  var COLOR_SUFIJO = { '00':'Blanco', '04':'Rojo', '05':'Azul', '06':'Amarillo', '07':'Verde', '08':'Morado' };
  function detectarColor(p, l){
    if(!p || !p.colores || !p.colores.length) return '';
    var d = String(l.descripcion||'').toUpperCase();
    for(var i = 0; i < COLORES_COMPRA.length; i++){
      if(COLORES_COMPRA[i][0].test(d)){
        var c = COLORES_COMPRA[i][1].find(function(x){ return p.colores.indexOf(x)>-1; });
        if(c) return c;
      }
    }
    var suf = String(l.codigo||'').match(/-(\d\d)$/);
    if(suf && COLOR_SUFIJO[suf[1]] && p.colores.indexOf(COLOR_SUFIJO[suf[1]])>-1) return COLOR_SUFIJO[suf[1]];

      var n = w.filter(function(x){ return pw.indexOf(x)>-1; }).length;

  // Al llegar datos nuevos de otros celulares se redibuja la pantalla; esto conserva lo que estés escribiendo.
  function capturarCampos(){
    var datos = {};
    document.querySelectorAll('#main input[id], #main textarea[id], .modal input[id], .modal textarea[id]').forEach(function(el){
      if(el.type==='file' || el.type==='hidden') return;
      if(el.value !== el.defaultValue) datos[el.id] = { valor: el.value, base: el.defaultValue };
    });
    var act = document.activeElement;
    var foco = (act && act.id && (act.tagName==='INPUT' || act.tagName==='TEXTAREA')) ? { id: act.id, ini: act.selectionStart, fin: act.selectionEnd } : null;
    return { datos: datos, foco: foco };
  }
  function restaurarCampos(c){
    Object.keys(c.datos).forEach(function(id){
      var el = document.getElementById(id);
      if(el && el.defaultValue === c.datos[id].base) el.value = c.datos[id].valor;
    });
    if(c.foco){
      var f = document.getElementById(c.foco.id);
      if(f){ try{ f.focus({preventScroll:true}); if(c.foco.ini!=null) f.setSelectionRange(c.foco.ini, c.foco.fin); }catch(e){} }
    }
  }
  function render(opts){
    var capt = (opts && opts.preservar) ? capturarCampos() : null;
    var scrollModal = (function(){ var m = document.querySelector('.modal'); return m ? m.scrollTop : 0; })();
    renderInterno();
    if(capt) restaurarCampos(capt);
    if(opts && opts.preservar){ var m2 = document.querySelector('.modal'); if(m2) m2.scrollTop = scrollModal; }
  }

  function lineasPedido(){
    var cant = state.pedido ? state.pedido.cant : {};
    var out = [];
    state.productos.forEach(function(p){
      var colores = (p.colores && p.colores.length) ? p.colores : [null];
      colores.forEach(function(color){
        var n = Number(cant[p.id + '|' + (color||'')]) || 0;
        if(n > 0) out.push({ p:p, color:color, cantidad:n });
      });
    });
    return out;
  }

  function enRangoPeriodo(fechaISO, periodo){
    var d = new Date(fechaISO);
    var now = new Date();
    if(periodo==='todo') return true;
    if(periodo==='anterior'){
      var m = now.getMonth()-1, y = now.getFullYear();
      if(m<0){ m=11; y-=1; }
      return d.getFullYear()===y && d.getMonth()===m;
    }
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  }

  function renderReportes(){
    if(!state.isAdmin){
      return '<div class="empty"><span class="bigdot"></span><br>Los reportes de ventas y utilidad son solo para el administrador.<br><br>'+
        '</div>';
    }
    var periodo = state.reportePeriodo || 'mes';
    var etiquetasP = {mes:'Este mes', anterior:'Mes anterior', todo:'Todo'};
    var chips = '<div class="chips">' + ['mes','anterior','todo'].map(function(p){
      return '<button class="chip'+(periodo===p?' active':'')+'" data-action="filtro-periodo" data-p="'+p+'">'+etiquetasP[p]+'</button>';
    }).join('') + '</div>';

    var ventasF = state.ventas.filter(function(v){ return enRangoPeriodo(v.fecha, periodo); });
    var totalVendido = ventasF.reduce(function(s,v){return s+(Number(v.total)||0);},0);
    var unidadesVendidas = 0;
    var porProducto = {};
    var porRuta = {};
    ventasF.forEach(function(v){
      (v.items||[]).forEach(function(it){
        unidadesVendidas += Number(it.cantidad)||0;
        if(!porProducto[it.productoId]) porProducto[it.productoId] = {nombre:it.nombre, unidades:0, total:0};
        porProducto[it.productoId].unidades += Number(it.cantidad)||0;
        porProducto[it.productoId].total += Number(it.subtotal)||0;
      });
      var key = v.rutaId || '__sin_ruta__';
      if(!porRuta[key]) porRuta[key] = {nombre:v.rutaNombre||'Sin ruta', total:0, pedidos:0};
      porRuta[key].total += Number(v.total)||0;
      porRuta[key].pedidos += 1;
    });
    var utilidadEstimada = 0;
    ventasF.forEach(function(v){ (v.items||[]).forEach(function(it){ utilidadEstimada += (Number(it.subtotal)||0) - costoDeItem(it); }); });
    var gastosF = state.gastos.filter(function(g){ return enRangoPeriodo(g.fecha, periodo); });
    var totalGastos = gastosF.reduce(function(s,g){return s+(Number(g.monto)||0);},0);
    var utilidadNeta = utilidadEstimada - totalGastos;
    var topProductos = Object.keys(porProducto).map(function(pid){
      return Object.assign({id:pid}, porProducto[pid]);
    }).sort(function(a,b){ return b.unidades - a.unidades; }).slice(0,8);
    var rutasOrd = Object.keys(porRuta).map(function(k){
      return Object.assign({id:k}, porRuta[k]);
    }).sort(function(a,b){ return b.total - a.total; });
    var maxRuta = rutasOrd.length ? rutasOrd[0].total : 0;
    var maxProd = topProductos.length ? topProductos[0].unidades : 0;

    var kpis = '<div class="kpi-grid">'+
      '<div class="kpi"><div class="num mono">'+fmtCOP(totalVendido)+'</div><div class="lbl">Vendido ('+etiquetasP[periodo].toLowerCase()+')</div></div>'+
      '<div class="kpi"><div class="num mono">'+ventasF.length+'</div><div class="lbl">Pedidos</div></div>'+
      '<div class="kpi"><div class="num mono">'+unidadesVendidas+'</div><div class="lbl">Unidades vendidas</div></div>'+
      '<div class="kpi"><div class="num mono" style="color:var(--green)">'+fmtCOP(utilidadEstimada)+'</div><div class="lbl">Utilidad bruta</div></div>'+
      '<div class="kpi"><div class="num mono" style="color:var(--red)">'+fmtCOP(totalGastos)+'</div><div class="lbl">Gastos de ruta</div></div>'+
      '<div class="kpi"><div class="num mono" style="color:'+(utilidadNeta>=0?'var(--green)':'var(--red)')+'">'+fmtCOP(utilidadNeta)+'</div><div class="lbl">Utilidad neta</div></div>'+
      '</div>';

    var rutasHtml = rutasOrd.length ? rutasOrd.map(function(r){
      var pct = maxRuta>0 ? Math.round((r.total/maxRuta)*100) : 0;
      return '<div class="bar-row">'+
        '<div class="row between small" style="margin-bottom:4px;"><span>'+esc(r.nombre)+' <span class="muted">('+r.pedidos+' ped.)</span></span><span class="mono">'+fmtCOP(r.total)+'</span></div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;"></div></div>'+
      '</div>';
    }).join('') : '<div class="empty">Sin ventas en este periodo.</div>';

    var prodHtml = topProductos.length ? topProductos.map(function(p,idx){
      var pct = maxProd>0 ? Math.round((p.unidades/maxProd)*100) : 0;
      return '<div class="bar-row">'+
        '<div class="row between small" style="margin-bottom:4px;"><span>'+(idx+1)+'. '+esc(p.nombre||'Sin nombre')+'</span><span class="mono">'+p.unidades+' und · '+fmtCOP(p.total)+'</span></div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%; background:var(--green);"></div></div>'+
      '</div>';
    }).join('') : '<div class="empty">Sin ventas en este periodo.</div>';

    var iaHtml = '';
    if(sampleApi){
      iaHtml = '<h2 class="section-title">Análisis con IA</h2><div class="card">'+
        (state.analisisLoading ? '<div class="small muted">Generando análisis…</div>' :
          (state.analisisIA ? '<div class="small" style="white-space:pre-wrap;line-height:1.6;">'+esc(state.analisisIA)+'</div>' : '<div class="small muted">Genera un resumen y recomendaciones a partir de las cifras de este periodo.</div>'))+
        '<button class="btn btn-primary btn-block" style="margin-top:10px;" data-action="generar-analisis-ia" '+(state.analisisLoading?'disabled':'')+'>'+(state.analisisIA?'Regenerar análisis':'✨ Generar análisis')+'</button>'+
      '</div>';
    }

    return chips + kpis +
      '<h2 class="section-title">Ventas por ruta</h2><div class="card">'+rutasHtml+'</div>'+
      '<h2 class="section-title">Productos más vendidos</h2><div class="card">'+prodHtml+'</div>'+
      iaHtml +
      '<div class="small muted" style="margin-top:14px;">La utilidad usa lo que realmente se cobró en cada factura menos el costo de compra de las unidades que salieron (salen primero las más antiguas, cada una con su precio de compra). Las facturas hechas antes de este cambio usan el costo actual del producto.</div>'+
      renderContabilidad();
  }

  function renderHistorial(){
    var filtros = ['todos','entrada','salida','garantia'];
    var etiquetas = {todos:'Todos', entrada:'Entradas', salida:'Salidas', garantia:'Garantías'};
    var filtroHtml = '<div class="chips">' + filtros.map(function(f){

    }).join('') + '</div>';

    var movs = state.movimientos.filter(function(m){ return state.histFiltro==='todos' || m.tipo===state.histFiltro; });
    var etiquetaMov = {entrada:'Entrada', salida:'Salida', garantia:'Garantía'};
    var movsHtml = !state.movAbierto ? '' : (movs.length ? movs.slice(0, 150).map(function(m){
      var badgeClass = m.tipo==='entrada'?'badge-entrada':(m.tipo==='garantia'?'badge-garantia':'badge-salida');
      var signo = m.tipo==='entrada' ? '+' : '-';
      return '<div class="list-item"><div class="row between">'+
        '<div><span class="badge '+badgeClass+'">'+(etiquetaMov[m.tipo]||m.tipo)+'</span> <span class="product-name" style="margin-left:6px;">'+esc(m.productoNombre)+'</span></div>'+
        '<span class="mono" style="font-weight:700;">'+signo+m.cantidad+'</span>'+
        '</div><div class="small muted" style="margin-top:3px;">'+fmtFecha(m.fecha)+(m.clienteNombre?(' · '+esc(m.clienteNombre)):'')+(m.nota?(' · '+esc(m.nota)):'')+'</div></div>';
    }).join('') : '<div class="empty">Sin movimientos.</div>');

    // Todo el historial se ve por ruta (sin opción "Todas")
    var hayHuerfanos = state.ventas.some(function(v){ return !v.rutaId || !rutaById(v.rutaId); }) || state.gastos.some(function(g){ return !g.rutaId || !rutaById(g.rutaId); });
    var rutasHist = state.rutas.slice();
    var hr = state.histRuta;
    if(!hr || (hr!=='__sin__' && !rutaById(hr))){
      var jAct = miJornada();
      var ultimaVenta = state.ventas.find(function(v){ return v.rutaId && rutaById(v.rutaId); });
      hr = (jAct && jAct.rutaId) || (ultimaVenta && ultimaVenta.rutaId) || (rutasHist[0] && rutasHist[0].id) || '__sin__';
    }
    var enRuta = function(rid){ return hr==='__sin__' ? (!rid || !rutaById(rid)) : rid===hr; };
    var nombreRutaHist = hr==='__sin__' ? 'Sin ruta' : ((rutaById(hr)||{}).nombre || '');
    var rutaChips = '<div class="chips">' +
      rutasHist.map(function(r){
        return '<button class="chip'+(hr===r.id?' active':'')+'" data-action="filtro-hist-ruta" data-ruta="'+r.id+'">'+esc(r.nombre)+'</button>';
      }).join('') +
      (hayHuerfanos ? '<button class="chip'+(hr==='__sin__'?' active':'')+'" data-action="filtro-hist-ruta" data-ruta="__sin__">Sin ruta</button>' : '') +
      '</div>';

    var ventasRuta = state.ventas.filter(function(v){ return enRuta(v.rutaId); });
    var gastosRuta = state.gastos.filter(function(g){ return enRuta(g.rutaId); });
    var jornadasRuta = state.jornadas.filter(function(j){ return enRuta(j.rutaId); });

    var deudores = ventasRuta.filter(function(v){ return v.tipoPago==='credito' && (Number(v.saldo)||0) > 0; });
    var totalDeuda = deudores.reduce(function(s,v){return s+(Number(v.saldo)||0);},0);
    var deudoresHtml = deudores.length ? deudores.map(function(v){
      return '<div class="list-item"><div class="row between">'+
        '<div><span class="product-name">'+esc(v.clienteNombre)+'</span>'+
          '<div class="small muted">Factura #'+v.numero+' · '+fmtFecha(v.fecha)+'</div></div>'+

    }
    else if(action==='abrir-nuevo-cliente'){ state.modal={type:'nuevo-cliente'}; render(); }
    else if(action==='abrir-editar-cliente'){ state.modal={type:'editar-cliente', cliente:clienteById(id)}; render(); }
    else if(action==='cerrar-modal'){ state.modal=null; render(); }
    else if(action==='toggle-reordenar'){ state.reordenando = !state.reordenando; render(); }
    else if(action==='mover-arriba' || action==='mover-abajo'){
      var idx = state.productos.findIndex(function(p){ return p.id===id; });
      var otroIdx = action==='mover-arriba' ? idx-1 : idx+1;
      if(idx<0 || otroIdx<0 || otroIdx>=state.productos.length) return;
      var a = state.productos[idx], b = state.productos[otroIdx];
      var ordenA = a.orden!=null ? a.orden : idx;
      var ordenB = b.orden!=null ? b.orden : otroIdx;
      await db.doc('productos/'+a.id).update({orden:ordenB});
      await db.doc('productos/'+b.id).update({orden:ordenA});
    }
    else if(action==='trigger-bulk-fotos'){
      var inp = document.getElementById('bulk-foto-input');
      if(inp) inp.click();
    }
    else if(action==='open-ajustes-empresa'){ state.activeTab='historial'; render(); window.scrollTo(0,document.body.scrollHeight); }
    else if(action==='guardar-producto'){
      var nombre = document.getElementById('mp-nombre').value.trim();
      var costoCompra = Number(document.getElementById('mp-costoCompra').value)||0;
      var costoVenta = Number(document.getElementById('mp-costoVenta').value)||0;
      if(!nombre){ toast('El nombre es obligatorio'); return; }
      var extra = {nombre:nombre, costoCompra:costoCompra, costoVenta:costoVenta, pendiente:false};
      var fotoInput = document.getElementById('mp-foto');
      if(assetsApi && fotoInput && fotoInput.files && fotoInput.files[0]){
        try{
          var subida = await assetsApi.upload(fotoInput.files[0]);
          extra.imagenId = subida.id;
          extra.imagenUrl = subida.url;
        }catch(err){ toast('No se pudo subir la foto, se guardó el producto sin ella'); }
      }
      if(state.modal.type==='editar-producto'){
        // si corrige el costo y el producto tiene lotes, se corrige el del último lote comprado
        var pAnt = productoById(state.modal.producto.id);
        if(pAnt && pAnt.lotes && pAnt.lotes.length && Number(pAnt.costoCompra) !== costoCompra){
          var lotesEd = pAnt.lotes.map(function(l){ return Object.assign({}, l); });
          lotesEd[lotesEd.length-1].costo = costoCompra;
          extra.lotes = lotesEd;
        }
        await editarProducto(state.modal.producto.id, extra);
      } else {
        extra.stock = Number(document.getElementById('mp-stock').value)||0;
        await crearProducto(extra);
      }
      state.modal=null; render(); toast('Producto guardado');
    }
    else if(action==='eliminar-producto'){
      if(confirm('¿Eliminar este producto?')){ await eliminarProducto(id); state.modal=null; render(); }
    }
    else if(action==='guardar-entrada'){
      var cant = Number(document.getElementById('me-cantidad').value)||0;
      var costo = document.getElementById('me-costo').value;
      var nota = document.getElementById('me-nota').value;
      var colorEl = document.getElementById('me-color');
      var colorEntrada = colorEl ? colorEl.value : null;
      if(cant<=0){ toast('Cantidad inválida'); return; }
      await registrarEntrada(state.modal.productoId, cant, costo, nota, colorEntrada);
      state.modal=null; render(); toast('Entrada registrada');
    }
    else if(action==='guardar-garantia'){
      var prodId = document.getElementById('mg-producto').value;
      var cantG = Number(document.getElementById('mg-cantidad').value)||0;
      var cliId = document.getElementById('mg-cliente').value;
      var notaG = document.getElementById('mg-nota').value;
      var colorElG = document.getElementById('mg-color');
      var colorG = colorElG ? colorElG.value : null;
      if(!prodId || cantG<=0){ toast('Completa producto y cantidad'); return; }
      await registrarGarantia(prodId, cantG, cliId, notaG, colorG);
      state.modal=null; render(); toast('Garantía registrada');
    }
    else if(action==='guardar-gasto'){
      var conceptoG = document.getElementById('mga-concepto').value.trim();
      var montoG = Number(document.getElementById('mga-monto').value)||0;
      var rutaG = document.getElementById('mga-ruta').value;
      var notaGasto = document.getElementById('mga-nota').value.trim();
      if(!conceptoG){ toast('El concepto es obligatorio'); return; }
      if(montoG<=0){ toast('Ingresa un monto válido'); return; }
      if(state.modal.type==='editar-gasto'){
        var rutaObjG = rutaG ? rutaById(rutaG) : null;
        db.doc('gastos/'+state.modal.gasto.id).update({
          concepto:conceptoG, monto:montoG, rutaId:rutaG||null, rutaNombre:rutaObjG?rutaObjG.nombre:'',
          nota:notaGasto, editadoEn:todayISO(), editadoPor:nombreUsuario()
        });
        state.modal=null; render(); toast('Gasto actualizado');
        return;
      }
      await registrarGasto({concepto:conceptoG, monto:montoG, rutaId:rutaG, nota:notaGasto});
      state.modal=null; render(); toast('Gasto registrado');
    }
    else if(action==='guardar-cliente'){
      var nombreC = document.getElementById('mc-nombre').value.trim();
      var telC = document.getElementById('mc-telefono').value.trim();
      var dirC = document.getElementById('mc-direccion').value.trim();
      var rutaC = document.getElementById('mc-ruta').value;
      var docC = document.getElementById('mc-documento').value.trim();
      var ciuC = document.getElementById('mc-ciudad').value.trim();
      if(!nombreC){ toast('El nombre es obligatorio'); return; }
      if(state.modal.type==='editar-cliente'){
        await editarCliente(state.modal.cliente.id, {nombre:nombreC, telefono:telC, direccion:dirC, rutaId:rutaC||null, documento:docC, ciudad:ciuC});
      } else {
        await crearCliente({nombre:nombreC, telefono:telC, direccion:dirC, rutaId:rutaC||null, documento:docC, ciudad:ciuC});
      }
      state.modal=null; render(); toast('Cliente guardado');
    }
    else if(action==='eliminar-cliente'){
      if(confirm('¿Eliminar este cliente?')){ await eliminarCliente(id); render(); }
    }
    else if(action==='crear-ruta'){
      var nombreR = document.getElementById('nueva-ruta-nombre').value.trim();
      if(!nombreR){ return; }
      await crearRuta(nombreR);
      render(); toast('Ruta creada');
    }
    else if(action==='eliminar-ruta'){
      if(confirm('¿Eliminar esta ruta?')){ await eliminarRuta(id); render(); }
    }
    else if(action==='reenviar-factura'){
      var venta = state.ventas.find(function(v){return v.id===id;});
      if(venta) reenviarFactura(venta);
    }
    else if(action==='guardar-empresa'){
      var valCfg = function(id){ return document.getElementById(id).value.trim(); };
      await guardarEmpresa({
        empresaNombre: valCfg('cfg-nombre'), empresaTitular: valCfg('cfg-titular'), empresaNit: valCfg('cfg-nit'), empresaDireccion: valCfg('cfg-direccion'),
        empresaCiudad: valCfg('cfg-ciudad'), empresaTelefono: valCfg('cfg-telefono'), empresaEmail: valCfg('cfg-email'),
        empresaInstagram: valCfg('cfg-instagram'), empresaWeb: valCfg('cfg-web'), notasFactura: document.getElementById('cfg-notas').value
      });
      toast('Datos de la empresa guardados');
    }
  });

  document.addEventListener('input', function(e){
    if(e.target.classList && e.target.classList.contains('pd-cant') && state.pedido){
      var vP = Math.max(0, Math.floor(Number(e.target.value)||0));
      state.pedido.cant[e.target.getAttribute('data-pk')] = vP || '';
      var bR = document.getElementById('pd-resumen'); if(bR) bR.textContent = textoResumenPedido();
      return;
    }
    if(state.modal && state.modal.type==='revisar-compra'){
      var liI = e.target.getAttribute && e.target.getAttribute('data-li');
      if(liI != null){
        var campoI = e.target.getAttribute('data-campo');
        if(campoI==='stock' || campoI==='costo'){ state.modal.lineas[Number(liI)][campoI] = Number(e.target.value)||0; }
        return;
      }
      var cabMap = {'rc-proveedor':'proveedor','rc-numero':'numero','rc-fecha':'fecha','rc-total':'total'};
      if(cabMap[e.target.id]){ state.modal.cab[cabMap[e.target.id]] = e.target.id==='rc-total' ? (Number(e.target.value)||0) : e.target.value; return; }
    }
    if(e.target.id==='rf-comentarios'){ state.checkoutComentarios = e.target.value; return; }
    if(e.target.id && e.target.id.indexOf('rf-nc-')===0 && state.modal){
      state.modal.nc = state.modal.nc || {};
      state.modal.nc[e.target.id.slice(6)] = e.target.value;
      return;
    }
    if(e.target.id==='rf-abono'){
      var total = Number(e.target.getAttribute('data-total'))||0;
      var abono = Math.max(0, Math.min(total, Number(e.target.value)||0));
      state.checkoutAbono = e.target.value;
      var saldoEl = document.getElementById('rf-saldo');
      if(saldoEl) saldoEl.textContent = fmtCOP(Math.max(0,total-abono));
      var itemsRF = buildCartItems();
      var clienteRF = clienteCheckout();
      var cfgRF = cfgEmpresa();
      var previewEl = document.getElementById('rf-preview');
      if(previewEl) previewEl.textContent = textoFactura('(sin asignar)', clienteRF, itemsRF, total, cfgRF, {tipo:'credito', abono:abono, medio:state.checkoutMedio||'efectivo', comentarios:(state.checkoutComentarios||'').trim(),
        vence: fechaVencimiento(state.editandoVenta ? state.editandoVenta.fecha : todayISO(), state.checkoutPlazo || 8)});
    }
  });

  document.addEventListener('change', async function(e){
    if(state.modal && state.modal.type==='revisar-compra'){
      var liC = e.target.getAttribute && e.target.getAttribute('data-li');
      if(liC != null){
        var lc = state.modal.lineas[Number(liC)]; var campoC = e.target.getAttribute('data-campo');
        if(campoC==='productoId'){ lc.productoId = e.target.value; lc.origen = 'elegido'; prepararLineaCompra(lc); render({preservar:true}); }
        else if(campoC==='color'){ lc.color = e.target.value; render({preservar:true}); }
        return;
      }
      if(e.target.id==='rc-costos'){ state.modal.actualizarCostos = e.target.checked; render({preservar:true}); return; }
      if(e.target.id==='rc-sumar'){ state.modal.sumarStock = e.target.checked; render({preservar:true}); return; }
      if(e.target.id==='rc-proveedor' || e.target.id==='rc-numero'){
        state.modal.cab.proveedor = document.getElementById('rc-proveedor').value;
        state.modal.cab.numero = document.getElementById('rc-numero').value;
        var dupN = buscarCompraDuplicada(state.modal.cab.proveedor, state.modal.cab.numero);
        if(!!dupN !== !!state.modal.duplicada){ state.modal.duplicada = dupN; if(dupN) state.modal.sumarStock = false; render({preservar:true}); }
        return;
      }
    }
    if(e.target.id==='sd-venta' && state.modal && state.modal.type==='soporte-dian'){ state.modal.ventaId = e.target.value; render(); return; }
    if(e.target.id==='rut-input'){
      var fr = e.target.files && e.target.files[0]; e.target.value = '';
      if(!fr || !state.isAdmin) return;
      toast('Leyendo el RUT…');
      try{
        var rut = leerRUT(await leerPDF(await fr.arrayBuffer()));
        if(!rut.valido){ toast('No pude leer ese PDF como RUT. Usa el PDF que descargas de la DIAN.'); return; }
        var nombreR = [rut.primerNombre, rut.otrosNombres, rut.primerApellido, rut.segundoApellido].filter(Boolean).join(' ');
        var tituloR = nombreR.toLowerCase().replace(/(^|\s)([a-záéíóúñ])/g, function(x, a, c){ return a + c.toUpperCase(); });
        var nitR = rut.numero.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + rut.dv;
        var dirR = rut.direccion;
        var ciudadR = [rut.municipio, rut.departamento].filter(Boolean).map(function(x){ return x.charAt(0).toUpperCase()+x.slice(1).toLowerCase(); }).join(', ');
        if(!confirm('RUT leído:\n\n'+nombreR+'\nNIT '+nitR+'\n'+dirR+'\n'+ciudadR+'\n'+(rut.responsabilidades||[]).join(', ')+'\n\nSe actualizan titular, NIT, dirección y ciudad de la cuenta de cobro. ¿Guardar?')) return;
        rut.leidoEn = todayISO();
        await db.doc('config/general').set({ rut:rut, empresaTitular:tituloR, empresaNit:nitR, empresaDireccion:dirR, empresaCiudad:ciudadR }, {merge:true});
        toast('RUT guardado');
      }catch(errR){ console.error(errR); toast('No pude leer ese PDF. Intenta de nuevo.'); }
      return;
    }
    if(e.target.id==='compra-pegar-input'){
      var fp = e.target.files && e.target.files[0]; e.target.value = '';
      if(fp) procesarEntradaCompra({file:fp});
      return;
    }
    if(e.target.id==='sel-cliente'){
      state.selectedClienteId = e.target.value || null;
      render();
    }
    else if(e.target.id==='conta-mes'){ state.contaMes = e.target.value; render(); }
    else if(e.target.id==='compra-archivo-input'){
      var fa = e.target.files && e.target.files[0]; e.target.value = '';
      var idA = state.adjuntarCompraId; state.adjuntarCompraId = null;
      if(!fa || !idA) return;
      toast('Subiendo archivo…');
      try{ await guardarArchivoCompra(idA, fa); toast('Archivo adjuntado'); }
      catch(err){ toast(err && err.code==='archivo-grande' ? 'El archivo es muy grande (máx. ~6 MB).' : mensajeError(err)); }
    }
    else if(e.target.id==='rf-cliente'){
      state.selectedClienteId = e.target.value || null;
      render();
    }
    else if(e.target.id==='rf-nc-rutaId' && state.modal){
      state.modal.nc = state.modal.nc || {};
      state.modal.nc.rutaId = e.target.value;
    }
    else if(e.target.id==='mg-producto'){
      state.modal.selectedProductoId = e.target.value;
      render();
    }
    else if(e.target.id==='bulk-foto-input'){
      var files = Array.prototype.slice.call(e.target.files||[]);
      if(!files.length) return;
      e.target.value = '';
      toast('Subiendo '+files.length+' foto(s)…');
      var ok = 0;
      for(var i=0;i<files.length;i++){
        var exito = await crearProductoPendienteDesdeFoto(files[i]);
        if(exito) ok++;
      }
      render();
      toast(ok+' de '+files.length+' producto(s) creados. Edítalos para poner nombre y precio.');
    }
    else if(e.target.id==='import-input'){
      var f = e.target.files && e.target.files[0];
      e.target.value = '';
      if(!f) return;
      if(!confirm('¿Importar los datos de "'+f.name+'"? Se agregan productos, clientes, rutas, ventas y movimientos.')) return;
      await importarDatos(f);
    }
    else if(e.target.getAttribute && e.target.getAttribute('data-rol-uid')){
      if(!state.isAdmin) return;
      var uidRol = e.target.getAttribute('data-rol-uid');
      if(state.auth.user && uidRol===state.auth.user.uid && e.target.value!=='admin'){
        toast('No puedes quitarte tu propio rol de admin.'); render(); return;
      }
      db.doc('usuarios/'+uidRol).update({rol:e.target.value});
      toast('Rol actualizado');
    }
  });

  // Al tocar "Recordar" se abre WhatsApp y queda anotado el día del recordatorio
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a.recordar-cobro');
    if(!a || !state.isAdmin) return;
    var idV = a.getAttribute('data-venta');
    enSegundoPlano(updateDoc(doc(fs, 'ventas/'+idV), { recordadoEn: todayISO() }));
  });

  // Pegar la factura en el recuadro punteado
  document.addEventListener('paste', function(e){
    var zona = e.target && e.target.closest && e.target.closest('#zona-pegar');
    if(!zona || !state.modal || state.modal.type!=='pegar-compra' || !state.isAdmin) return;
    e.preventDefault();
    var cd = e.clipboardData; if(!cd) return;
    var archivoP = null;
    if(cd.files && cd.files.length) archivoP = cd.files[0];
    else if(cd.items){
      for(var i = 0; i < cd.items.length; i++){
        if(cd.items[i].kind==='file'){ archivoP = cd.items[i].getAsFile(); if(archivoP) break; }
      }
    }
    if(archivoP) return procesarEntradaCompra({file:archivoP});
    var txt = cd.getData('text/plain');
    if(txt && txt.trim()) return procesarEntradaCompra({texto:txt});
    toast('No llegó nada. Copia la factura y vuelve a intentar.');
  });

  if('serviceWorker' in navigator && !USE_EMULATORS){
    window.addEventListener('load', function(){
      var teniaVersion = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').then(function(reg){
        reg.addEventListener('updatefound', function(){
          var w = reg.installing; if(!w) return;
          w.addEventListener('statechange', function(){
            if(w.state==='activated' && teniaVersion){ state.hayActualizacion = true; render(); }
          });
        });
        // busca versiones nuevas cada 30 minutos y al volver a la app
        setInterval(function(){ reg.update().catch(function(){}); }, 30*60*1000);
        document.addEventListener('visibilitychange', function(){ if(!document.hidden) reg.update().catch(function(){}); });
      }).catch(function(){});
    });
  }
  render();
})();
</script>
</body>
</html>
